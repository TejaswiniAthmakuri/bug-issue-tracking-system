
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Tracker Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #263238;
        }

        header {
            background: #253858;
            color: white;
            padding: 22px 35px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header p {
            margin-bottom: 0;
            color: #dbe5f5;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            padding: 24px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #0000000d;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd2da;
            border-radius: 5px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .primary {
            background: #315efb;
            color: white;
        }

		 .edit {
		    background: #fff0c2;
		    color: #795500;
		    margin-right: 8px;
		    margin-bottom: 5px;
		}

		.delete {
		    background: #ffe1e1;
		    color: #b42318;
		    margin-bottom: 5px;
		}

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #e7eaf0;
        }

        th {
            background: #f7f8fb;
            font-size: 13px;
        }

        .status, .priority {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

       
		.status.open {
		    background: #FEE2E2;
		    color: #991B1B;
		}
		
		.status.in-progress {
		    background: #FEF3C7;
		    color: #92400E;
		}
		
		.status.resolved {
		    background: #D1FAE5;
		    color: #065F46;
		}
		
		.priority.low {
		    background: #d4edda;
		    color:#155724;
		}
		
		.priority.medium {
		    background: #fff3cd;
		    color: #856404;
		}
		
		.priority.high {
		    background: #f8d7da;
		    color: #721c24;
		}


        #message {
            margin-top: 12px;
            font-size: 14px;
        }

        @media (max-width: 650px) {
            header {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .panel {
                padding: 16px;
            }
            
            #message {
    			margin-top: 12px;
    			font-size: 14px;
			}
		}
			
			
			
/* Dashboard Summary Cards */

.dashboard-cards {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
    margin-bottom: 25px;
}

.summary-card {
    background: white;
    padding: 22px;
    border-radius: 10px;
    box-shadow: 0 2px 10px #0000000d;
    border-left: 5px solid #315efb;
}

.summary-card h3 {
    margin: 0 0 12px;
    font-size: 15px;
    color: #5f6b7a;
}

.summary-card p {
    margin: 0;
    font-size: 30px;
    font-weight: bold;
    color: #253858;
}

.summary-card.open {
    border-left-color: #e74c3c;
}

.summary-card.progress {
    border-left-color: #f39c12;
}

.summary-card.resolved {
    border-left-color: #27ae60;
}

/* Tablets and smaller laptop windows */
@media (max-width: 900px) {
    .dashboard-cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .summary-card {
        padding: 16px;
    }
}

/* Mobile screens */
@media (max-width: 480px) {
    .dashboard-cards {
        grid-template-columns: 1fr;
    }
}

        }
        
		        .filter-container {
		    display: flex;
		    gap: 12px;
		    flex-wrap: wrap;
		    margin: 20px 0;
		}
		
		.filter-container input,
		.filter-container select {
		    padding: 10px;
		    border: 1px solid #ccc;
		    border-radius: 6px;
		    font-size: 14px;
		}
		
		.filter-container input {
		    flex: 1;
		    min-width: 200px;
		}
		
		.filter-container select {
		    min-width: 150px;
		}
		
		
		button.view {
		    background-color: #0d6efd;
		    color: white;
		    border: none;
		    padding: 7px 12px;
		    border-radius: 5px;
		    cursor: pointer;
		    margin-right: 5px;
		}
		
		button.view:hover {
		    background-color: #0b5ed7;
		}
		
		/* Bug Details Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.6);
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
}

.modal-content {
    background-color: #ffffff;
    width: 100%;
    max-width: 500px;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    position: relative;
    animation: modalSlideIn 0.25s ease;
}

.modal-content h2 {
    margin-top: 0;
    margin-bottom: 20px;
    color: #1f2937;
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 12px;
}

.modal-content p {
    margin: 14px 0;
    color: #374151;
    overflow-wrap: anywhere;
}

.modal-description {
    margin-top: 20px;
    padding: 15px;
    background-color: #f3f4f6;
    border-radius: 8px;
}

.modal-description p {
    margin-bottom: 0;
    white-space: pre-wrap;
}

.close-modal {
    position: absolute;
    top: 12px;
    right: 15px;
    background: transparent;
    border: none;
    font-size: 28px;
    color: #6b7280;
    cursor: pointer;
}

.close-modal:hover {
    color: #111827;
}

@keyframes modalSlideIn {
    from {
        opacity: 0;
        transform: translateY(-15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

    </style>
</head>

<body>
    <header>
        <h1>Bug Tracker</h1>
        <p>Track, manage, and resolve software issues</p>
    </header>
    
    

    <main>
		

		<!-- Dashboard summary cards -->
		<section class="dashboard-cards">
		    <div class="summary-card">
		        <h3>Total Bugs</h3>
		        <p id="totalBugs">0</p>
		    </div>
		
		    <div class="summary-card open">
		        <h3>Open</h3>
		        <p id="openBugs">0</p>
		    </div>
		
		    <div class="summary-card progress">
		        <h3>In Progress</h3>
		        <p id="progressBugs">0</p>
		    </div>
		
		    <div class="summary-card resolved">
		        <h3>Resolved</h3>
		        <p id="resolvedBugs">0</p>
		    </div>
		</section>


        <section class="panel">
            <h2 id="formTitle">Report a New Bug</h2>

            <form id="bugForm">
                <div class="form-grid">
                    <div>
                        <label for="title">Bug Title</label>
                        <input id="title" type="text"
                               placeholder="Enter bug title" required>
                    </div>

                    <div>
                        <label for="priority">Priority</label>
                        <select id="priority" required>
                            <option value="LOW">Low</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="HIGH">High</option>
                        </select>
                    </div>

                    <div class="full-width">
                        <label for="description">Description</label>
                        <textarea id="description"
                                  placeholder="Describe the issue"
                                  required></textarea>
                    </div>

                    <div>
                        <label for="status">Status</label>
                        <select id="status" required>
                            <option value="OPEN">Open</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="RESOLVED">Resolved</option>
                        </select>
                    </div>

                    <div style="align-self: end;">
                        <button class="primary" type="submit"
                                id="submitButton">Add Bug</button>
                        <button type="button" id="cancelButton"
                                hidden>Cancel Edit</button>
                    </div>
                </div>
            </form>
	
	            <p id="message" role="status"></p>
	        </section>
	        
	        <div class="filter-container">
	    <input
	        type="text"
	        id="searchInput"
	        placeholder="Search bugs by title..."
	        oninput="filterBugs()"
	    >
	
	    <select id="statusFilter" onchange="filterBugs()">
	        <option value="">All Statuses</option>
	        <option value="OPEN">Open</option>
	        <option value="IN_PROGRESS">In Progress</option>
	        <option value="RESOLVED">Resolved</option>
	    </select>
	
	    <select id="priorityFilter" onchange="filterBugs()">
	        <option value="">All Priorities</option>
	        <option value="LOW">Low</option>
	        <option value="MEDIUM">Medium</option>
	        <option value="HIGH">High</option>
	    </select>
	    
	    <select id="sortBy" onchange="filterBugs()">
		    <option value="id">Sort by Bug ID</option>
		    <option value="priority">Sort by Priority</option>
		    <option value="status">Sort by Status</option>
		    <option value="title">Sort by Title</option>
		</select>
	</div>

        <section class="panel">
            <h2>Reported Bugs</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Status</th>
                            <th>Priority</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bugTable">
                        <tr>
                            <td colspan="5">Loading bugs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
        
        
		

    </main>
    
    <!-- Bug Details Modal -->
<div id="bugModal" class="modal">
    <div class="modal-content">
        <button type="button" id="closeModalButton" class="close-modal">
            &times;
        </button>

        <h2>Bug Details</h2>

        <p><strong>Bug ID:</strong> <span id="modalBugId"></span></p>
        <p><strong>Title:</strong> <span id="modalBugTitle"></span></p>
        <p><strong>Status:</strong> <span id="modalBugStatus"></span></p>
        <p><strong>Priority:</strong> <span id="modalBugPriority"></span></p>

        <div class="modal-description">
            <strong>Description</strong>
            <p id="modalBugDescription"></p>
        </div>
    </div>
</div>
    
    

    <script>
        const API_URL = "/api/bugs";

        const bugForm = document.getElementById("bugForm");
        const bugTable = document.getElementById("bugTable");
        const message = document.getElementById("message");

        let allBugs= [];
        let editingId = null;

        async function loadBugs() {
            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Could not load bugs.");
                }

                
			const bugs = await response.json();
			allBugs = bugs;
			
			// Update dashboard summary cards
			document.getElementById("totalBugs").textContent =
			    bugs.length;
			
			document.getElementById("openBugs").textContent =
			    bugs.filter(bug => bug.status === "OPEN").length;
			
			document.getElementById("progressBugs").textContent =
			    bugs.filter(bug => bug.status === "IN_PROGRESS").length;
			
			document.getElementById("resolvedBugs").textContent =
			    bugs.filter(bug => bug.status === "RESOLVED").length;
			
			

              renderBugs(allBugs);

                   
            } catch (error) {
                bugTable.replaceChildren();
                const row = bugTable.insertRow();
                const cell = row.insertCell();
                cell.colSpan = 5;
                cell.textContent = "Unable to load bugs. Check the backend.";
                message.textContent = error.message;
            }
        }

        bugForm.addEventListener("submit", async event => {
            event.preventDefault();

            const bug = {
                title: document.getElementById("title").value.trim(),
                description: document.getElementById("description").value.trim(),
                status: document.getElementById("status").value,
                priority: document.getElementById("priority").value
            };

            if (!bug.title || !bug.description) {
                message.textContent = "Please enter the title and description.";
                return;
            }

            const url = editingId === null
                ? API_URL
                : `${API_URL}/${editingId}`;

            const method = editingId === null ? "POST" : "PUT";

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(bug)
                });

                if (!response.ok) {
                    throw new Error("Could not save the bug.");
                }

                message.textContent = editingId === null
                    ? "Bug added successfully!"
                    : "Bug updated successfully!";

                resetForm();
                await loadBugs();
            } catch (error) {
                message.textContent = error.message;
            }
        });
        
        

function filterBugs() {
    const searchValue = document.getElementById("searchInput")
        .value.toLowerCase();

    const statusValue = document.getElementById("statusFilter").value;
    const priorityValue = document.getElementById("priorityFilter").value;
    const sortValue = document.getElementById("sortBy").value;

    let filteredBugs = allBugs.filter(bug => {
        const matchesSearch = (bug.title || "")
            .toLowerCase()
            .includes(searchValue);

        const matchesStatus = statusValue === "" ||
            bug.status === statusValue;

        const matchesPriority = priorityValue === "" ||
            bug.priority === priorityValue;

        return matchesSearch && matchesStatus && matchesPriority;
    });

    const priorityOrder = {
        HIGH: 1,
        MEDIUM: 2,
        LOW: 3
    };

    filteredBugs.sort((a, b) => {
        if (sortValue === "id") {
            return Number(a.id) - Number(b.id);
        }

        if (sortValue === "priority") {
            return (priorityOrder[a.priority] || 99) -
                   (priorityOrder[b.priority] || 99);
        }

        if (sortValue === "status") {
            return a.status.localeCompare(b.status);
        }

        if (sortValue === "title") {
            return a.title.localeCompare(b.title);
        }

        return 0;
    });

    renderBugs(filteredBugs);
}




function renderBugs(bugs) {
    bugTable.replaceChildren();

    if (bugs.length === 0) {
        const row = bugTable.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 5;
        cell.textContent = "No matching bugs found.";
        return;
    }

    bugs.forEach(bug => {
        const row = bugTable.insertRow();

        [bug.id, bug.title, bug.status, bug.priority]
            .forEach((value, index) => {
                const cell = row.insertCell();

                if (index === 2) {
                    const badge = document.createElement("span");
                    badge.className = "status " +
                        value.toLowerCase().replace("_", "-");
                    badge.textContent = value;
                    cell.appendChild(badge);
                } else if (index === 3) {
                    const badge = document.createElement("span");
                    badge.className =
                        "priority " + String(value).toLowerCase();
                    badge.textContent = value;
                    cell.appendChild(badge);
                } else {
                    cell.textContent = value ?? "";
                }
            });

		       
		const actions = row.insertCell();
		
		const viewButton = document.createElement("button");
		viewButton.className = "view";
		viewButton.textContent = "View";
		viewButton.addEventListener("click", () => viewBug(bug));
		
		const editButton = document.createElement("button");
		editButton.className = "edit";
		editButton.textContent = "Edit";
		editButton.addEventListener("click", () => editBug(bug));
		
		const deleteButton = document.createElement("button");
		deleteButton.className = "delete";
		deleteButton.textContent = "Delete";
		deleteButton.addEventListener("click", () => deleteBug(bug.id));
		
		actions.append(viewButton, editButton, deleteButton);
	});
}

		
function viewBug(bug) {
    document.getElementById("modalBugId").textContent = bug.id;
    document.getElementById("modalBugTitle").textContent = bug.title;
    document.getElementById("modalBugStatus").textContent = bug.status;
    document.getElementById("modalBugPriority").textContent = bug.priority;
    document.getElementById("modalBugDescription").textContent =
        bug.description || "No description provided.";

    document.getElementById("bugModal").style.display = "flex";
}


        function editBug(bug) {
            editingId = bug.id;

            document.getElementById("title").value = bug.title;
            document.getElementById("description").value = bug.description;
            document.getElementById("status").value = bug.status;
            document.getElementById("priority").value = bug.priority;

            document.getElementById("formTitle").textContent = "Edit Bug";
            document.getElementById("submitButton").textContent = "Update Bug";
            document.getElementById("cancelButton").hidden = false;

            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        async function deleteBug(id) {
            if (!confirm("Are you sure you want to delete this bug?")) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    throw new Error("Could not delete the bug.");
                }

                message.textContent = "Bug deleted successfully!";
                await loadBugs();
            } catch (error) {
                message.textContent = error.message;
            }
        }

        function resetForm() {
            bugForm.reset();
            editingId = null;
            document.getElementById("formTitle").textContent = "Report a New Bug";
            document.getElementById("submitButton").textContent = "Add Bug";
            document.getElementById("cancelButton").hidden = true;
        }

        document.getElementById("cancelButton").addEventListener("click", resetForm);

        loadBugs();
        
        
const bugModal = document.getElementById("bugModal");
const closeModalButton = document.getElementById("closeModalButton");

closeModalButton.addEventListener("click", function () {
    bugModal.style.display = "none";
});

bugModal.addEventListener("click", function (event) {
    if (event.target === bugModal) {
        bugModal.style.display = "none";
    }
});

document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
        bugModal.style.display = "none";
    }
});

    </script>
</body>
</html>
